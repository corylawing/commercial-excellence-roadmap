.staticrypt-html{height:100%}

.staticrypt-toggle-password-visibility{cursor:pointer;position:absolute;right:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;opacity:.5}

.staticrypt-form .staticrypt-decrypt-button{width:100%;border:0;border-radius:8px;padding:16px 24px;background:var(--ink);color:#fff;cursor:pointer;

.hidden{display:none!important}
.staticrypt-spinner-container{height:100%;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.staticrypt-spinner{width:2rem;height:2rem;border:.25em solid var(--teal);border-right-color:transparent;border-radius:50%;animation:spin .75s linear infinite}
